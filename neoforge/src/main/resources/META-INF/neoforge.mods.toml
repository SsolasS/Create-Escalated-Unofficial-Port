modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "https://github.com/Create-In-Locomotion/Create-Escalated/issues"
license = "MIT"

[[mods]]
modId = "escalated"
version = "${version}"
displayName = "Create: Escalated"
